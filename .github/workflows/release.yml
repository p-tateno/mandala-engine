name: Release Mandala Engine

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate plugin files
        run: npm run check
      - name: Build plugin archive
        run: zip mandala-engine-${GITHUB_REF_NAME}.zip main.js manifest.json styles.css
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
            mandala-engine-${{ github.ref_name }}.zip
